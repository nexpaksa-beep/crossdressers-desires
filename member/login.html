    <meta

    >

    <title>

    </title>

    <style>

        /* ==========================================================
           ROOT VARIABLES
           ========================================================== */

        :root {

            --black:
                #100b12;

            --black-soft:
                #171017;

            --burgundy:
                #5c1838;

            --burgundy-dark:
                #351021;

            --rose:
                #b65c7d;

            --gold:
                #d8b06a;

            --gold-light:
                #f1d99b;

            --cream:
                #f7f0e8;

            --muted:
                #c9bcc2;

            --border:
                rgba(
                    216,
                    176,
                    106,
                    0.20
                );

            --shadow:
                0 25px 70px
                rgba(
                    0,
                    0,
                    0,
                    0.40
                );

        }


        /* ==========================================================
           RESET
           ========================================================== */

        * {

            margin:
                0;

            padding:
                0;

            box-sizing:
                border-box;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            font-family:
                "Montserrat",
                sans-serif;

            background:
                var(--black);

            color:
                var(--cream);

            line-height:
                1.7;

            overflow-x:
                hidden;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        button,
        input {

            font-family:
                inherit;

        }


        img {

            max-width:
                100%;

            display:
                block;

        }


        /* ==========================================================
           CONTAINER
           ========================================================== */

        .container {

            width:
                min(
                    1180px,
                    calc(
                        100% - 40px
                    )
                );

            margin:
                0 auto;

        }


        /* ==========================================================
           HEADER
           ========================================================== */

        .site-header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            background:
                rgba(
                    16,
                    11,
                    18,
                    0.94
                );

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid
                var(--border);

        }


        .nav-container {

            min-height:
                78px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                24px;

        }


        .logo {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                28px;

            font-weight:
                600;

            color:
                var(--cream);

            line-height:
                1;

            white-space:
                nowrap;

        }


        .logo span {

            display:
                block;

            color:
                var(--gold);

            font-size:
                21px;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            margin-top:
                3px;

        }


        .nav-links {

            display:
                flex;

            align-items:
                center;

            gap:
                4px;

        }


        .nav-links a {

            padding:
                10px 13px;

            border-radius:
                10px;

            color:
                var(--muted);

            font-size:
                13px;

            font-weight:
                500;

            transition:
                0.25s ease;

        }


        .nav-links a:hover {

            color:
                var(--gold-light);

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

        }


        .nav-links .nav-join {

            color:
                var(--black);

            background:
                var(--gold);

            font-weight:
                700;

            margin-left:
                6px;

        }


        .nav-links .nav-join:hover {

            background:
                var(--gold-light);

            color:
                var(--black);

        }


        .menu-toggle {

            display:
                none;

            border:
                1px solid
                var(--border);

            background:
                transparent;

            color:

            width:

            height:
                44px;

            border-radius:

            font-size:

            cursor:

        }

           LOGIN SECTION
           ========================================================== */

        .login-section {

            min-height:

                relative;

            background:
                radial-gradient(

                    rgba(
                        92,
                        24,
                        56,
                        0.30
                    ),
                    transparent 38%

                radial-gradient(
                    circle at 85% 80%,
                    rgba(
                        216,
                        176,
                        106,
                        0.08
                    ),
                    transparent 34%
                );

        }


        .login-grid {

            display:
                grid;

            grid-template-columns:
                0.9fr 1.1fr;

            gap:
                70px;

            align-items:
                center;

        }

           HERO COPY
           ========================================================== */

        .hero-copy {

            max-width:

        }


        .eyebrow {

            display:

                8px;

            color:
                var(--gold-light);

            font-size:
                11px;

            font-weight:
                700;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

            margin-bottom:
                18px;

        }


        .eyebrow::before {

            content:
                "";

            width:
                30px;

            height:
                1px;

            background:
                var(--gold);

        }


        .hero-copy h1 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    48px,
                    6vw,

                );

            font-weight:
                500;

            line-height:
                0.95;

            margin-bottom:
                24px;

            color:
                var(--cream);

        }


        .hero-copy h1 span {

            display:
                block;

            color:
                var(--gold);

        }


        .hero-copy > p {

            color:
                var(--muted);

            font-size:
                16px;

            max-width:
                520px;

            margin-bottom:
                35px;

        }


        /* ==========================================================
           TRUST LIST
           ========================================================== */

        .trust-list {

            display:
                grid;

            gap:
                15px;

        }


        .trust-item {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            color:
                var(--muted);

            font-size:
                14px;

        }


        .trust-item i {

            width:

        }

           LOGIN CARD
           ========================================================== */

            max-width:

                    rgba(

            border-radius:

            box-shadow:

            margin-bottom:

            color:

        }

            color:
                var(--muted);

            font-size:
                13px;

        }

            font-weight:

        }

            color:
                var(--gold);

        }

            border-radius:
                12px;

            outline:
                none;

            background:
                rgba(
                    16,
                    11,
                    18,
                    0.72
                );

            color:
                var(--cream);

            font-size:
                14px;

            transition:
                0.25s ease;

        }


        .form-group input::placeholder {

            color:
                #8e8188;

        }


        .form-group input:focus {

            border-color:
                var(--gold);

            box-shadow:
                0 0 0 3px
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

        }


        .password-toggle {

            position:
                absolute;

            right:
                14px;

            top:
                50%;

            transform:
                translateY(
                    -50%
                );

            border:
                0;

            background:
                transparent;

            color:
                var(--muted);

            cursor:
                pointer;

            width:
                30px;

            height:

        }


        .password-toggle:hover {

            color:

        }

           FORM OPTIONS
           ========================================================== */

        .form-options {

            display:
                flex;

            align-items:
                center;

            justify-content:

        }


        .remember-row {

            display:
                flex;

            align-items:
                center;

            color:
                var(--muted);

            font-size:
                12px;

        }


        .remember-row input {

            width:
                16px;

            height:
                16px;

            accent-color:
                var(--gold);

            cursor:
                pointer;

        }


        .forgot-link {

            color:
                var(--gold-light);

            font-size:
                12px;

            font-weight:
                600;

        }


        .forgot-link:hover {

            text-decoration:
                underline;

        }


        /* ==========================================================
           LOGIN BUTTON
           ========================================================== */

        .login-button {

            width:
                100%;

            min-height:
                54px;

            border:
                0;

            border-radius:

            background:
                linear-gradient(
                    135deg,
                    var(--gold),
                    var(--gold-light)
                );

            color:
                var(--black);

            font-size:
                14px;

            font-weight:
                800;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                10px;

            transition:
                0.25s ease;

        }


        .login-button:hover {

            transform:
                translateY(
                    -2px
                );

            box-shadow:
                0 12px 30px
                rgba(
                    216,
                    176,
                    106,
                    0.18
                );

        }


        .login-button:active {

            transform:
                translateY(
                    0
                );

        }

           REGISTER NOTE

                center;

            margin-top:
                25px;

            padding-top:
                24px;

            border-top:

                rgba(
                    216,
                    176,
                    106,
                    0.12
                );

            color:
                var(--muted);

            font-size:
                13px;

        }


        .register-note a {

            color:
                var(--gold-light);

            font-weight:
                700;

        }


        .register-note a:hover {

            text-decoration:
                underline;

        }
