<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="Private member dashboard for Crossdresser's Desires East Rand."
    >

    <title>
        Member Dashboard | Crossdresser's Desires
    </title>


    <!-- ==========================================================
         GOOGLE FONTS
         ========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================================
         FONT AWESOME
         ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==========================================================
         PAGE STYLES
         ========================================================== -->

    <style>

        /* ==========================================================
           ROOT VARIABLES
           ========================================================== */

        :root {

            --black:
                #100b12;

            --black-soft:
                #171017;

            --burgundy:
                #5c1838;

            --burgundy-dark:
                #351021;

            --rose:
                #b65c7d;

            --gold:
                #d8b06a;

            --gold-light:
                #f1d99b;

            --cream:
                #f7f0e8;

            --muted:
                #c9bcc2;

            --border:
                rgba(
                    216,
                    176,
                    106,
                    0.20
                );

            --shadow:
                0 25px 70px
                rgba(
                    0,
                    0,
                    0,
                    0.40
                );

        }


        /* ==========================================================
           RESET
           ========================================================== */

        * {

            margin:
                0;

            padding:
                0;

            box-sizing:
                border-box;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            font-family:
                "Montserrat",
                sans-serif;

            background:
                var(--black);

            color:
                var(--cream);

            line-height:
                1.7;

            overflow-x:
                hidden;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        button {

            font-family:
                inherit;

        }


        /* ==========================================================
           CONTAINER
           ========================================================== */

        .container {

            width:
                min(
                    1180px,
                    calc(
                        100% - 40px
                    )
                );

            margin:
                0 auto;

        }


        /* ==========================================================
           HEADER
           ========================================================== */

        .site-header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            background:
                rgba(
                    16,
                    11,
                    18,
                    0.95
                );

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid
                var(--border);

        }


        .nav-container {

            min-height:
                78px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                24px;

        }


        .logo {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                28px;

            font-weight:
                600;

            color:
                var(--cream);

            line-height:
                1;

            white-space:
                nowrap;

        }


        .logo span {

            display:
                block;

            color:
                var(--gold);

            font-size:
                21px;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            margin-top:
                3px;

        }


        .nav-links {

            display:
                flex;

            align-items:
                center;

            gap:
                4px;

        }


        .nav-links a {

            padding:
                10px 13px;

            border-radius:
                10px;

            color:
                var(--muted);

            font-size:
                13px;

            font-weight:
                500;

            transition:
                0.25s ease;

        }


        .nav-links a:hover {

            color:
                var(--gold-light);

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

        }


        .nav-links .logout-link {

            color:
                var(--rose);

        }


        .nav-links .logout-link:hover {

            color:
                #e58aa8;

        }


        .menu-toggle {

            display:
                none;

            border:
                1px solid
                var(--border);

            background:
                transparent;

            color:
                var(--gold);

            width:
                44px;

            height:
                44px;

            border-radius:
                10px;

            font-size:
                18px;

            cursor:
                pointer;

        }


        /* ==========================================================
           DASHBOARD
           ========================================================== */

        .dashboard-section {

            padding:
                65px 0 90px;

            min-height:
                calc(
                    100vh - 78px
                );

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(
                        92,
                        24,
                        56,
                        0.24
                    ),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 40%,
                    rgba(
                        216,
                        176,
                        106,
                        0.07
                    ),
                    transparent 30%
                );

        }


        /* ==========================================================
           DASHBOARD HEADER
           ========================================================== */

        .dashboard-heading {

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

            gap:
                30px;

            margin-bottom:
                35px;

        }


        .eyebrow {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            color:
                var(--gold-light);

            font-size:
                11px;

            font-weight:
                700;

            letter-spacing:
                2px;

            text-transform:
                uppercase;

            margin-bottom:
                12px;

        }


        .eyebrow::before {

            content:
                "";

            width:
                30px;

            height:
                1px;

            background:
                var(--gold);

        }


        .dashboard-heading h1 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    42px,
                    5vw,
                    64px
                );

            font-weight:
                500;

            line-height:
                1;

            margin-bottom:
                10px;

        }


        .dashboard-heading h1 span {

            color:
                var(--gold);

        }


        .dashboard-heading p {

            color:
                var(--muted);

            font-size:
                14px;

            max-width:
                650px;

        }


        .member-status {

            flex:
                0 0 auto;

            display:
                inline-flex;

            align-items:
                center;

            gap:
                9px;

            padding:
                10px 15px;

            border:
                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.25
                );

            border-radius:
                30px;

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.05
                );

            color:
                var(--gold-light);

            font-size:
                11px;

            font-weight:
                700;

            letter-spacing:
                0.5px;

        }


        .status-dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            background:
                var(--gold);

            box-shadow:
                0 0 12px
                rgba(
                    216,
                    176,
                    106,
                    0.55
                );

        }


        /* ==========================================================
           PROFILE SUMMARY
           ========================================================== */

        .profile-banner {

            display:
                grid;

            grid-template-columns:
                auto 1fr auto;

            align-items:
                center;

            gap:
                22px;

            padding:
                25px;

            margin-bottom:
                25px;

            border:
                1px solid
                var(--border);

            border-radius:
                20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        92,
                        24,
                        56,
                        0.42
                    ),
                    rgba(
                        23,
                        16,
                        23,
                        0.96
                    )
                );

            box-shadow:
                var(--shadow);

        }


        .profile-avatar {

            width:
                72px;

            height:
                72px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                2px solid
                var(--gold);

            background:
                linear-gradient(
                    145deg,
                    var(--burgundy),
                    var(--burgundy-dark)
                );

            color:
                var(--gold-light);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                34px;

            font-weight:
                600;

        }


        .profile-summary h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                30px;

            font-weight:
                600;

            margin-bottom:
                2px;

        }


        .profile-summary p {

            color:
                var(--muted);

            font-size:
                12px;

        }


        .profile-summary p span {

            color:
                var(--gold-light);

        }


        .profile-button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            padding:
                11px 18px;

            border:
                1px solid
                var(--border);

            border-radius:
                10px;

            color:
                var(--gold-light);

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.05
                );

            font-size:
                12px;

            font-weight:
                700;

            transition:
                0.25s ease;

        }


        .profile-button:hover {

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.12
                );

            border-color:
                var(--gold);

        }


        /* ==========================================================
           DASHBOARD GRID
           ========================================================== */

        .dashboard-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                20px;

        }


        .dashboard-card {

            position:
                relative;

            overflow:
                hidden;

            padding:
                25px;

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            background:
                var(--black-soft);

            transition:
                0.3s ease;

        }


        .dashboard-card:hover {

            transform:
                translateY(
                    -3px
                );

            border-color:
                rgba(
                    216,
                    176,
                    106,
                    0.38
                );

            box-shadow:
                0 18px 45px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

        }


        .dashboard-card.wide {

            grid-column:
                span 2;

        }


        .dashboard-card.full {

            grid-column:
                1 / -1;

        }


        .card-icon {

            width:
                45px;

            height:
                45px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                12px;

            margin-bottom:
                17px;

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

            border:
                1px solid
                var(--border);

            color:
                var(--gold);

            font-size:
                17px;

        }


        .dashboard-card h3 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                27px;

            font-weight:
                600;

            margin-bottom:
                7px;

        }


        .dashboard-card > p {

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.7;

        }


        /* ==========================================================
           MEMBERSHIP CARD
           ========================================================== */

        .membership-card {

            background:
                linear-gradient(
                    145deg,
                    rgba(
                        92,
                        24,
                        56,
                        0.58
                    ),
                    rgba(
                        23,
                        16,
                        23,
                        0.98
                    )
                );

        }


        .membership-price {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                38px;

            color:
                var(--gold-light);

            line-height:
                1;

            margin:
                12px 0 4px;

        }


        .membership-period {

            color:
                var(--muted);

            font-size:
                11px;

        }


        .membership-status {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            margin-top:
                17px;

            padding:
                7px 11px;

            border-radius:
                20px;

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

            color:
                var(--gold-light);

            font-size:
                10px;

            font-weight:
                700;

        }


        /* ==========================================================
           QUICK ACTIONS
           ========================================================== */

        .quick-actions {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap:
                10px;

            margin-top:
                17px;

        }


        .quick-action {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            padding:
                11px;

            border:
                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.12
                );

            border-radius:
                10px;

            color:
                var(--muted);

            font-size:
                10px;

            transition:
                0.2s ease;

        }


        .quick-action i {

            color:
                var(--gold);

        }

                .quick-action:hover {

            color:
                var(--gold-light);

            border-color:
                var(--border);

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.05
                );

        }


        /* ==========================================================
           EVENT LIST
           ========================================================== */

        .event-list {

            display:
                grid;

            gap:
                12px;

            margin-top:
                18px;

        }


        .event-item {

            display:
                grid;

            grid-template-columns:
                55px 1fr auto;

            align-items:
                center;

            gap:
                12px;

            padding:
                12px;

            border:
                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.10
                );

            border-radius:
                12px;

            background:
                rgba(
                    16,
                    11,
                    18,
                    0.40
                );

        }


        .event-date {

            text-align:
                center;

            padding:
                7px 4px;

            border-radius:
                9px;

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

            border:
                1px solid
                var(--border);

        }


        .event-date strong {

            display:
                block;

            color:
                var(--gold-light);

            font-size:
                16px;

            line-height:
                1.1;

        }


        .event-date span {

            display:
                block;

            color:
                var(--muted);

            font-size:
                8px;

            text-transform:
                uppercase;

        }


        .event-info h4 {

            font-size:
                12px;

            margin-bottom:
                2px;

        }


        .event-info p {

            color:
                var(--muted);

            font-size:
                10px;

        }


        .event-link {

            color:
                var(--gold-light);

            font-size:
                10px;

            font-weight:
                700;

        }


        /* ==========================================================
           EXPERIENCE ITEMS
           ========================================================== */

        .experience-list {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap:
                10px;

            margin-top:
                18px;

        }


        .experience-item {

            padding:
                15px;

            border:
                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.10
                );

            border-radius:
                12px;

            background:
                rgba(
                    16,
                    11,
                    18,
                    0.35
                );

        }


        .experience-item i {

            color:
                var(--gold);

            margin-bottom:
                8px;

        }


        .experience-item h4 {

            font-size:
                12px;

            margin-bottom:
                3px;

        }


        .experience-item p {

            color:
                var(--muted);

            font-size:
                10px;

            line-height:
                1.6;

        }


        /* ==========================================================
           COMMUNITY UPDATE
           ========================================================== */

        .community-update {

            display:
                grid;

            grid-template-columns:
                auto 1fr;

            gap:
                17px;

            align-items:
                flex-start;

            margin-top:
                18px;

            padding:
                17px;

            border:
                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.10
                );

            border-radius:
                13px;

            background:
                rgba(
                    92,
                    24,
                    56,
                    0.15
                );

        }


        .community-update-icon {

            width:
                42px;

            height:
                42px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

            color:
                var(--gold);

        }


        .community-update h4 {

            font-size:
                13px;

            margin-bottom:
                4px;

        }


        .community-update p {

            color:
                var(--muted);

            font-size:
                11px;

        }


        /* ==========================================================
           VENUE CARD
           ========================================================== */

        .venue-card {

            display:
                grid;

            grid-template-columns:
                auto 1fr auto;

            align-items:
                center;

            gap:
                20px;

            padding:
                23px;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        92,
                        24,
                        56,
                        0.42
                    ),
                    rgba(
                        53,
                        16,
                        33,
                        0.25
                    )
                );

        }


        .venue-icon {

            width:
                55px;

            height:
                55px;

            border-radius:
                14px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(
                    216,
                    176,
                    106,
                    0.08
                );

            border:
                1px solid
                var(--border);

            color:
                var(--gold);

            font-size:
                21px;

        }


        .venue-card h3 {

            margin-bottom:
                3px;

        }


        .venue-card p {

            max-width:
                700px;

        }


        .venue-link {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            color:
                var(--gold-light);

            font-size:
                11px;

            font-weight:
                700;

            white-space:
                nowrap;

        }


        /* ==========================================================
           PRIVACY STRIP
           ========================================================== */

        .privacy-strip {

            margin-top:
                25px;

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap:
                12px;

        }


        .privacy-item {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            padding:
                13px;

            border:
                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.10
                );

            border-radius:
                10px;

            color:
                var(--muted);

            font-size:
                10px;

            text-align:
                center;

        }


        .privacy-item i {

            color:
                var(--gold);

        }


        /* ==========================================================
           FOOTER
           ========================================================== */

        .site-footer {

            padding:
                70px 0 25px;

            background:
                #0b080d;

            border-top:
                1px solid
                var(--border);

        }


        .footer-grid {

            display:
                grid;

            grid-template-columns:
                1.5fr
                1fr
                1fr
                1.2fr;

            gap:
                45px;

            padding-bottom:
                50px;

        }


        .footer-brand {

            max-width:
                340px;

        }


        .footer-logo {

            display:
                inline-block;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                29px;

            font-weight:
                600;

            line-height:
                0.9;

            margin-bottom:
                18px;

        }


        .footer-logo span {

            display:
                block;

            color:
                var(--gold);

            font-size:
                19px;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            margin-top:
                5px;

        }


        .footer-brand p {

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.8;

            margin-bottom:
                20px;

        }


        .footer-badges {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                8px;

        }


        .footer-badges span {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                6px 9px;

            border:
                1px solid
                var(--border);

            border-radius:
                20px;

            color:
                var(--muted);

            font-size:
                10px;

        }


        .footer-badges i {

            color:
                var(--gold);

        }


        .footer-column {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-start;

            gap:
                9px;

        }


        .footer-column h3 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                23px;

            color:
                var(--cream);

            margin-bottom:
                7px;

        }


        .footer-column a {

            color:
                var(--muted);

            font-size:
                12px;

            transition:
                0.2s ease;

        }


        .footer-column a:hover {

            color:
                var(--gold-light);

            transform:
                translateX(
                    3px
                );

        }


        .footer-bottom {

            padding-top:
                22px;

            border-top:
                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.10
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            color:
                #8e8188;

            font-size:
                10px;

        }


        /* ==========================================================
