<style>

    /* ==========================================================
       ROOT
       ========================================================== */

    :root {

        --black: #100b12;
        --black-soft: #171017;

        --burgundy: #5c1838;
        --burgundy-dark: #351021;

        --rose: #b65c7d;

        --gold: #d8b06a;
        --gold-light: #f1d99b;

        --cream: #f7f0e8;
        --muted: #c9bcc2;

        --border:
            rgba(216,176,106,0.20);

        --shadow:
            0 25px 70px
            rgba(0,0,0,0.40);

    }


    /* ==========================================================
       RESET
       ========================================================== */

    * {

        margin: 0;
        padding: 0;

        box-sizing: border-box;

    }


    html {

        scroll-behavior: smooth;

    }


    body {

        background:
            radial-gradient(
                circle at top,
                #29131f 0%,
                var(--black) 45%,
                #0c080e 100%
            );

        color: var(--cream);

        font-family:
            "Montserrat",
            sans-serif;

        line-height: 1.7;

        overflow-x: hidden;

    }


    a {

        color: inherit;

        text-decoration: none;

    }


    img {

        max-width: 100%;

        display: block;

    }


    .container {

        width: min(
            1180px,
            calc(100% - 40px)
        );

        margin: 0 auto;

    }


    /* ==========================================================
       HEADER
       ========================================================== */

    header {

        position: sticky;

        top: 0;

        z-index: 1000;

        background:
            rgba(16,11,18,0.94);

        backdrop-filter:
            blur(18px);

        border-bottom:
            1px solid var(--border);

    }


    .header-inner {

        min-height: 82px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 30px;

    }


    .logo {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size: 30px;

        font-weight: 600;

        color:
            var(--gold-light);

        letter-spacing:
            0.5px;

        white-space: nowrap;

    }


    .logo span {

        display: block;

        font-family:
            "Montserrat",
            sans-serif;

        font-size: 8px;

        letter-spacing:
            3px;

        text-transform:
            uppercase;

        color:
            var(--muted);

        margin-top: -5px;

    }


    nav {

        display: flex;

        align-items: center;

        gap: 24px;

    }


    nav a {

        font-size: 12px;

        font-weight: 500;

        letter-spacing:
            0.7px;

        color:
            var(--muted);

        transition:
            color 0.3s ease;

    }


    nav a:hover,
    nav a.active {

        color:
            var(--gold-light);

    }


    .nav-join {

        padding:
            11px 18px;

        border:
            1px solid
            var(--gold);

        color:
            var(--gold-light) !important;

        border-radius:
            30px;

    }


    .nav-join:hover {

        background:
            var(--gold);

        color:
            var(--black) !important;

    }


    #menuToggle {

        display: none;

        border: 1px solid
            var(--border);

        background:
            transparent;

        color:
            var(--gold-light);

        width: 44px;

        height: 40px;

        border-radius: 8px;

        font-size: 21px;

        cursor: pointer;

    }


    /* ==========================================================
       HERO
       ========================================================== */

    .hero {

        min-height: 620px;

        display: flex;

        align-items: center;

        position: relative;

        overflow: hidden;

        background:
            linear-gradient(
                135deg,
                rgba(92,24,56,0.70),
                rgba(16,11,18,0.92)
            );

    }


    .hero::before {

        content: "";

        position: absolute;

        width: 520px;

        height: 520px;

        border-radius: 50%;

        background:
            rgba(182,92,125,0.10);

        filter:
            blur(20px);

        top: -180px;

        right: -120px;

    }


    .hero::after {

        content: "";

        position: absolute;

        width: 380px;

        height: 380px;

        border-radius: 50%;

        background:
            rgba(216,176,106,0.07);

        filter:
            blur(30px);

        bottom: -180px;

        left: -100px;

    }


    .hero-content {

        position: relative;

        z-index: 2;

        max-width: 820px;

        padding:
            100px 0;

    }


    .eyebrow {

        display: inline-flex;

        align-items: center;

        gap: 10px;

        color:
            var(--gold-light);

        font-size: 11px;

        font-weight: 600;

        letter-spacing:
            2.5px;

        text-transform:
            uppercase;

        margin-bottom: 20px;

    }


    .eyebrow::before {

        content: "";

        width: 35px;

        height: 1px;

        background:
            var(--gold);

    }

            "Cormorant Garamond",

        margin-bottom: 28px;

        color:

    }

        color:
            var(--gold-light);

        font-style:
            italic;

    }


    .hero p {

        max-width: 690px;

        font-size: 17px;

        color:

        line-height: 1.9;

    }


    .hero-note {

        margin-top: 30px;

        display: inline-flex;

        padding:
            10px 18px;

        border:
            1px solid
            var(--border);

        background:
            rgba(255,255,255,0.03);

        border-radius:
            30px;

        color:
            var(--gold-light);

        font-size: 11px;

        letter-spacing:
            1px;

    }


    /* ==========================================================
       SECTIONS
       ========================================================== */

    section {

        padding:
            100px 0;

    }


    .section-heading {

        max-width: 760px;

            center;

    }

            "Cormorant Garamond",

        font-size:

        margin-bottom:

    }


    .section-heading p {

        color:
            var(--muted);

        font-size:
            15px;

    }

       ========================================================== */

        display:
            grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap:

    }


    .event-card {

        position:

        min-height:

        display:
            flex;

            column;

        justify-content:

        transition:

        content: "";

        position:

        color:

        text-transform:

    }


    .event-card h3 {

        position:
            relative;

        z-index:
            2;

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            32px;

        font-weight:
            500;

        margin-bottom:
            12px;

    }


    .event-card p {

        position:
            relative;

        z-index:

        color:

        font-size:

        line-height:

    }


    .event-meta {

        position:
            relative;

        z-index:
            2;

        margin-top:
            25px;

        padding-top:
            18px;

        border-top:

        flex-wrap:

        gap:

    }


    .event-tag {

        padding:

        border:

        border-radius:
            20px;

        font-size:
            9px;

        letter-spacing:
            0.7px;

        color:
            var(--gold-light);

    }

       FEATURED EVENT
       ========================================================== */

        display:
            grid;

        grid-template-columns:

        min-height:

        border:

        background:

                #171017

        box-shadow:
            var(--shadow);

    }


    .featured-visual {

        min-height:

        display:
            flex;

        align-items:

        justify-content:

        position:

        background:

                rgba(182,92,125,0.30),

    }


    .featured-symbol {

        width:

        height:

        border:
            1px solid

        border-radius:

        display:
            flex;

        align-items:

        justify-content:

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:

        color:
            var(--gold-light);

        box-shadow:

    }


    .featured-content {

        padding:

        display:
            flex;

        flex-direction:
            column;

        justify-content:
            center;

    }


    .featured-content h2 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:

        font-weight:
            500;

        line-height:

        margin-bottom:
            22px;

    }


    .featured-content h2 span {

        color:
            var(--gold-light);

        font-style:
            italic;

    }


    .featured-content p {

        color:
            var(--muted);

        font-size:
            14px;

        line-height:
            1.9;

        margin-bottom:
            18px;

    }


    .event-details {

        display:
            grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap:
            14px;

        margin:
            25px 0 30px;

    }


    .detail-box {

        padding:
            16px;

        border:
            1px solid
            var(--border);

        background:
            rgba(255,255,255,0.025);

        border-radius:
            10px;

    }


    .detail-box span {

        display:
            block;

        color:
            var(--muted);

        font-size:
            9px;

        text-transform:
            uppercase;

        letter-spacing:
            1.5px;

        margin-bottom:
            4px;

    }


    .detail-box strong {

        color:
            var(--cream);

        font-size:
            12px;

        font-weight:
            500;

    }


    .btn {

        display:
            inline-flex;

        align-items:
            center;

        justify-content:
            center;

        width:
            fit-content;

        padding:
            13px 24px;

        border:
            1px solid
            var(--gold);

        border-radius:
            30px;

        color:
            var(--gold-light);

        font-size:
            11px;

        font-weight:
            600;

        letter-spacing:
            1px;

        text-transform:
            uppercase;

        transition:
            all 0.3s ease;

    }


    .btn:hover {

        background:
            var(--gold);

        color:
            var(--black);

    }


    /* ==========================================================
       EVENT TYPES
       ========================================================== */

    .types-section {

        background:
            rgba(255,255,255,0.015);

        border-top:
            1px solid
            rgba(216,176,106,0.08);

        border-bottom:
            1px solid
            rgba(216,176,106,0.08);

    }


    .types-grid {

        display:
            grid;

        grid-template-columns:
            repeat(4, 1fr);

        gap:
            18px;

    }


    .type-card {

        padding:
            30px 24px;

        text-align:
            center;

        border:
            1px solid
            var(--border);

        border-radius:
            15px;

        background:
            rgba(255,255,255,0.02);

        transition:
            transform 0.3s ease,
            background 0.3s ease;

    }


    .type-card:hover {

        transform:
            translateY(-5px);

        background:
            rgba(92,24,56,0.18);

    }


    .type-icon {

        font-size:
            30px;

        color:
            var(--gold-light);

        margin-bottom:
            15px;

    }


    .type-card h3 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            26px;

        font-weight:
            500;

        margin-bottom:
            8px;

    }


    .type-card p {

        color:
            var(--muted);

        font-size:
            11px;

        line-height:
            1.7;

    }


    /* ==========================================================
       FUTURE RETREATS
       ========================================================== */

    .retreat-section {

        position:
            relative;

        overflow:
            hidden;

    }


    .retreat-box {

        padding:
            70px;

        border:
            1px solid
            var(--border);

        border-radius:
            24px;

        text-align:
            center;

        background:
            linear-gradient(
                135deg,
                rgba(92,24,56,0.34),
                rgba(23,16,23,0.88)
            );

        box-shadow:
            var(--shadow);

    }


    .retreat-box h2 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            clamp(42px, 5vw, 64px);

        font-weight:
            500;

        margin-bottom:
            18px;

    }


    .retreat-box h2 span {

        color:
            var(--gold-light);

        font-style:
            italic;

    }


    .retreat-box p {

        max-width:
            760px;

        margin:
            0 auto 28px;

        color:
            var(--muted);

        font-size:
            14px;

        line-height:
            1.9;

    }


    .retreat-points {

        display:
            flex;

        justify-content:
            center;

        flex-wrap:
            wrap;

        gap:
            10px;

        margin-bottom:
            30px;

    }


    .retreat-points span {

        padding:
            8px 13px;

        border:
            1px solid
            var(--border);

        border-radius:
            20px;

        color:
            var(--gold-light);

        font-size:
            10px;

    }


    /* ==========================================================
       PRIVACY
       ========================================================== */

    .privacy-strip {

        padding:
            70px 0;

        background:
            linear-gradient(
                90deg,
                rgba(53,16,33,0.95),
                rgba(92,24,56,0.60),
                rgba(53,16,33,0.95)

    }


    .privacy-content {

        display:
            grid;

        grid-template-columns:
            1fr 2fr;

        gap:
            50px;

        align-items:
            center;

    }
