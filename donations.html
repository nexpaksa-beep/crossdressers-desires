<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Support the future of Crossdresser's Desires East Rand and help us build a private, welcoming community and The Desires House."
    >

    <meta
        name="keywords"
        content="Crossdresser's Desires, East Rand, Gauteng, crossdresser community, adult community, private community, The Desires House"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>
        Support The Vision | Crossdresser's Desires East Rand
    </title>


    <!-- ==========================================================
         GOOGLE FONTS
         ========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================================
         PAGE STYLE
         ========================================================== -->

    <style>

        :root {

            --black:
                #100b12;

            --black-soft:
                #171017;

            --burgundy:
                #5c1838;

            --burgundy-dark:
                #351021;

            --rose:
                #b65c7d;

            --gold:
                #d8b06a;

            --gold-light:
                #f1d99b;

            --cream:
                #f7f0e8;

            --muted:
                #c9bcc2;

            --border:
                rgba(216,176,106,0.20);

            --shadow:
                0 25px 70px rgba(0,0,0,0.40);

        }


        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            background:
                var(--black);

            color:
                var(--cream);

            font-family:
                "Montserrat",
                sans-serif;

            line-height:
                1.7;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        img {

            max-width:
                100%;

            display:
                block;

        }


        .container {

            width:
                min(1120px, 92%);

            margin:
                0 auto;

        }


        /* ==========================================================
           HEADER
           ========================================================== */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            background:
                rgba(16,11,18,0.96);

            backdrop-filter:
                blur(14px);

            border-bottom:
                1px solid var(--border);

        }


        .header-inner {

            min-height:
                82px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                25px;

        }


        .logo {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                1.65rem;

            font-weight:
                700;

            color:
                var(--gold-light);

            letter-spacing:
                0.5px;

            white-space:
                nowrap;

        }


        .logo span {

            display:
                block;

            font-family:
                "Montserrat",
                sans-serif;

            font-size:
                0.55rem;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            color:
                var(--muted);

        }


        nav ul {

            display:
                flex;

            align-items:
                center;

            gap:
                22px;

            list-style:
                none;

        }


        nav a {

            font-size:
                0.82rem;

            color:
                var(--muted);

            transition:
                0.3s ease;

        }


        nav a:hover {

            color:
                var(--gold-light);

        }


        .join-button {

            padding:
                11px 18px;

            border:
                1px solid var(--gold);

            color:
                var(--gold-light);

            border-radius:
                30px;

            font-weight:
                600;

        }


        .join-button:hover {

            background:
                var(--gold);

            color:
                var(--black);

        }


        .menu-toggle {

            display:
                none;

            border:
                1px solid var(--border);

            background:
                transparent;

            color:
                var(--gold-light);

            font-size:
                1.4rem;

            padding:
                8px 12px;

            border-radius:
                8px;

            cursor:
                pointer;

        }


        /* ==========================================================
           HERO
           ========================================================== */

        .hero {

            min-height:
                68vh;

            display:
                flex;

            align-items:
                center;

            position:
                relative;

            overflow:
                hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(182,92,125,0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(216,176,106,0.10),
                    transparent 35%
                );

        }


        .hero::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    135deg,
                    rgba(92,24,56,0.30),
                    transparent 55%
                );

            pointer-events:
                none;

        }


        .hero-content {

            position:
                relative;

            z-index:
                1;

            max-width:
                850px;

            padding:
                90px 0;

        }


        .eyebrow {

            display:
                inline-block;

            margin-bottom:
                18px;

            color:
                var(--gold);

            font-size:
                0.76rem;

            font-weight:
                600;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

        }


        h1,
        h2,
        h3 {

            font-family:
                "Cormorant Garamond",
                serif;

            line-height:
                1.1;

        }


        h1 {

            font-size:
                clamp(3rem, 8vw, 6rem);

            color:
                var(--cream);

            margin-bottom:
                25px;

        }


        .hero p {

            max-width:
                760px;

            color:
                var(--muted);

            font-size:
                1.05rem;

        }


        /* ==========================================================
           SECTIONS
           ========================================================== */

        section {

            padding:
                90px 0;

        }


        .section-heading {

            max-width:
                760px;

            margin:
                0 auto 55px;

            text-align:
                center;

        }


        .section-heading span {

            display:
                block;

            color:
                var(--gold);

            font-size:
                0.75rem;

            font-weight:
                600;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            margin-bottom:
                12px;

        }


        .section-heading h2 {

            font-size:
                clamp(2.3rem, 5vw, 4rem);

            margin-bottom:
                18px;

        }


        .section-heading p {

            color:
                var(--muted);

        }


        /* ==========================================================
           INTRO
           ========================================================== */

        .intro {

            background:
                var(--black-soft);

        }


        .intro-grid {

            display:
                grid;

            grid-template-columns:
                1.1fr 0.9fr;

            gap:
                50px;

            align-items:
                center;

        }


        .intro-copy h2 {

            font-size:
                clamp(2.4rem, 5vw, 4rem);

            margin-bottom:
                22px;

        }


        .intro-copy p {

            color:
                var(--muted);

            margin-bottom:
                18px;

        }


        .intro-card {

            padding:
                38px;

            border:
                1px solid var(--border);

            background:
                linear-gradient(
                    145deg,
                    rgba(92,24,56,0.42),
                    rgba(23,16,23,0.95)
                );

            box-shadow:
                var(--shadow);

        }


        .intro-card .amount {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                3.4rem;

            color:
                var(--gold-light);

            margin-bottom:
                5px;

        }


        .intro-card .label {

            color:
                var(--muted);

            font-size:
                0.82rem;

            text-transform:
                uppercase;

            letter-spacing:
                2px;

            margin-bottom:
                25px;

        }


        .intro-card p {

            color:
                var(--muted);

        }


        /* ==========================================================
           SUPPORT OPTIONS
           ========================================================== */

        .support {

            background:
                var(--black);

        }


        .support-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                24px;

        }


        .support-card {

            padding:
                35px 30px;

            border:
                1px solid var(--border);

            background:
                var(--black-soft);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;

        }


        .support-card:hover {

            transform:
                translateY(-6px);

            border-color:
                rgba(216,176,106,0.50);

        }


        .support-number {

            color:
                var(--gold);

            font-size:
                0.75rem;

            font-weight:
                700;

            letter-spacing:
                2px;

            margin-bottom:
                18px;

        }


        .support-card h3 {

            font-size:
                1.9rem;

            margin-bottom:
                15px;

        }


        .support-card p {

            color:
                var(--muted);

            font-size:
                0.92rem;

        }


        /* ==========================================================
           VISION
           ========================================================== */

        .vision {

            background:
                var(--burgundy-dark);

            border-top:
                1px solid var(--border);

            border-bottom:
                1px solid var(--border);

        }


        .vision-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                24px;

        }


        .vision-card {

            padding:
                32px;

            border:
                1px solid var(--border);

            background:
                rgba(16,11,18,0.42);

        }


        .vision-card h3 {

            color:
                var(--gold-light);

            font-size:
                2rem;

            margin-bottom:
                12px;

        }


        .vision-card p {

            color:
                var(--muted);

        }


        /* ==========================================================
           TRANSPARENCY
           ========================================================== */

        .transparency {

            background:
                var(--black-soft);

        }


        .transparency-box {

            max-width:
                850px;

            margin:
                0 auto;

            padding:
                45px;

            border:
                1px solid var(--border);

            text-align:
                center;

        }


        .transparency-box h2 {

            font-size:
                clamp(2.2rem, 5vw, 3.5rem);

            margin-bottom:
                20px;

        }


        .transparency-box p {

            color:
                var(--muted);

            margin-bottom:
                16px;

        }


        /* ==========================================================
           DONATION CTA
           ========================================================== */

        .donation-cta {

            background:
                linear-gradient(
                    135deg,
                    var(--burgundy),
                    var(--burgundy-dark)
                );

            text-align:
                center;

        }


        .donation-cta h2 {

            font-size:
                clamp(2.5rem, 6vw, 4.5rem);

            margin-bottom:
                20px;

        }


        .donation-cta p {

            max-width:
                700px;

            margin:
                0 auto 30px;

            color:
                var(--muted);

        }


        .cta-button {

            display:
                inline-block;

            padding:
                14px 28px;

            background:
                var(--gold);

            color:
                var(--black);

            font-weight:
                700;

            border-radius:
                30px;

            transition:
                0.3s ease;

        }


        .cta-button:hover {

            background:
                var(--gold-light);

            transform:
                translateY(-2px);

        }


        /* ==========================================================
           PRIVACY STRIP
           ========================================================== */

        .privacy {

            padding:
                55px 0;

            background:
                var(--black);

            border-top:
                1px solid var(--border);

            border-bottom:
                1px solid var(--border);

        }


        .privacy-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                25px;

        }


        .privacy-card {

            text-align:
                center;

            padding:
                20px;

        }


        .privacy-card strong {

            display:
                block;

            color:
                var(--gold-light);

            margin-bottom:
                8px;

        }


        .privacy-card span {

            color:
                var(--muted);

            font-size:
                0.85rem;

        }


        /* ==========================================================
           FOOTER
           ========================================================== */

        footer {

            background:
                #0b080d;

            padding:
                70px 0 25px;

            border-top:
                1px solid var(--border);

        }


        .footer-grid {

            display:
                grid;

            grid-template-columns:
                1.5fr 1fr 1fr;

            gap:
                50px;

            padding-bottom:
                45px;

        }


        .footer-brand h3 {

            font-size:
                2.1rem;

            color:
                var(--gold-light);

            margin-bottom:
                15px;

        }


        .footer-brand p {

            max-width:
                430px;

            color:
                var(--muted);

            font-size:
                0.9rem;

        }


        .footer-column h4 {

            color:
                var(--cream);

            margin-bottom:
                18px;

            font-size:
                0.9rem;

            text-transform:
                uppercase;

            letter-spacing:
                2px;

        }


        .footer-column ul {

            list-style:
                none;

        }


        .footer-column li {

            margin-bottom:
                10px;

        }


        .footer-column a {

            color:
                var(--muted);

            font-size:
                0.85rem;

            transition:
                0.3s ease;

        }


        .footer-column a:hover {

            color:
                var(--gold-light);

        }


        .footer-bottom {

            padding-top:
                25px;

            border-top:
                1px solid var(--border);

            display:
                flex;

            justify-content:
                space-between;

            gap:
                20px;

            flex-wrap:
                wrap;

        }


        .footer-bottom p,
        .footer-meta {

            color:
                var(--muted);

            font-size:
                0.75rem;

        }


        .footer-meta {

            display:
                flex;

            gap:
                9px;

        }


        /* ==========================================================
           ANIMATION
           ========================================================== */

        .fade {

            opacity:
                0;

            transform:
                translateY(25px);

            transition:
                opacity 0.7s ease,
                transform 0.7s ease;

        }


        .fade.visible {

            opacity:
                1;

            transform:
                translateY(0);

        }

           RESPONSIVE
           ========================================================== */

                gap:
