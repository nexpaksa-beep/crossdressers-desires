<!-- ==========================================================
     PAGE STYLES
     ========================================================== -->

<style>

    :root {

        --black:
            #100b12;

        --black-soft:
            #171017;

        --burgundy:
            #5c1838;

        --burgundy-dark:
            #351021;

        --rose:
            #b65c7d;

        --gold:
            #d8b06a;

        --gold-light:
            #f1d99b;

        --cream:
            #f7f0e8;

        --muted:
            #c9bcc2;

        --border:
            rgba(
                216,
                176,
                106,
                0.20
            );

        --shadow:
            0 25px 70px
            rgba(
                0,
                0,
                0,
                0.40
            );

    }


    * {

        margin:
            0;

        padding:
            0;

        box-sizing:
            border-box;

    }


    html {

        scroll-behavior:
            smooth;

    }


    body {

        font-family:
            "Montserrat",
            sans-serif;

        background:
            var(--black);

        color:
            var(--cream);

        line-height:
            1.8;

        overflow-x:
            hidden;

    }


    a {

        color:
            inherit;

        text-decoration:
            none;

    }


    img {

        max-width:
            100%;

        display:
            block;

    }


    .container {

        width:
            min(
                1180px,
                92%
            );

        margin:
            0 auto;

    }


    /* ==========================================================
       HEADER
       ========================================================== */

    header {

        position:
            sticky;

        top:
            0;

        z-index:
            1000;

        background:
            rgba(
                16,
                11,
                18,
                0.96
            );

        backdrop-filter:
            blur(14px);

        border-bottom:
            1px solid var(--border);

    }


    .navbar {

        min-height:
            82px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            space-between;

        gap:
            30px;

    }


    .logo {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            2rem;

        font-weight:
            700;

        color:
            var(--gold-light);

        letter-spacing:
            0.03em;

    }


    .logo span {

        color:
            var(--rose);

    }


    .nav-links {

        display:
            flex;

        align-items:
            center;

        gap:
            25px;

    }


    .nav-links a {

        color:
            var(--muted);

        font-size:
            0.82rem;

        font-weight:
            500;

        letter-spacing:
            0.04em;

        transition:
            0.3s ease;

    }


    .nav-links a:hover {

        color:
            var(--gold-light);

    }


    .nav-join {

        padding:
            11px 19px;

        border:
            1px solid var(--gold);

        color:
            var(--gold-light) !important;

    }


    .menu-toggle {

        display:
            none;

        background:
            none;

        border:
            none;

        color:
            var(--gold-light);

        font-size:
            1.5rem;

        cursor:
            pointer;

    }


    /* ==========================================================
       HERO
       ========================================================== */

    .hero {

        position:
            relative;

        padding:
            110px 0 90px;

        text-align:
            center;

        background:
            radial-gradient(
                circle at 50% 20%,
                rgba(
                    92,
                    24,
                    56,
                    0.50
                ),
                transparent 45%
            );

    }


    .eyebrow {

        display:
            inline-block;

        margin-bottom:
            18px;

        color:
            var(--gold);

        font-size:
            0.75rem;

        font-weight:
            700;

        letter-spacing:
            0.20em;

        text-transform:
            uppercase;

    }


    .hero h1 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            clamp(
                3.2rem,
                7vw,
                5.8rem
            );

        line-height:
            0.95;

        font-weight:
            600;

        color:
            var(--cream);

        margin-bottom:
            28px;

    }


    .hero h1 span {

        color:
            var(--gold);

    }


    .hero p {

        max-width:
            760px;

        margin:
            0 auto;

        color:
            var(--muted);

        font-size:
            1rem;

    }


    .hero-badges {

        margin-top:
            30px;

        display:
            flex;

        justify-content:
            center;

        flex-wrap:
            wrap;

        gap:
            10px;

    }


    .hero-badges span {

        padding:
            8px 15px;

        border:
            1px solid var(--border);

        background:
            rgba(
                255,
                255,
                255,
                0.025
            );

        color:
            var(--gold-light);

        font-size:
            0.72rem;

        letter-spacing:
            0.06em;

    }


    /* ==========================================================
       FAQ LAYOUT
       ========================================================== */

    .faq-section {

        padding:
            80px 0 110px;

    }


    .faq-layout {

        display:
            grid;

        grid-template-columns:
            260px 1fr;

        gap:
            55px;

        align-items:
            start;

    }


    .faq-sidebar {

        position:
            sticky;

        top:
            110px;

        padding:
            25px;

        border:
            1px solid var(--border);

        background:
            var(--black-soft);

    }


    .faq-sidebar h3 {

        font-family:
            "Cormorant Garamond",
            serif;

        color:
            var(--gold-light);

        font-size:
            1.7rem;

        margin-bottom:
            20px;

    }


    .faq-sidebar a {

        display:
            block;

        padding:
            10px 0;

        color:
            var(--muted);

        border-bottom:
            1px solid
            rgba(
                255,
                255,
                255,
                0.06
            );

        font-size:
            0.82rem;

        transition:
            0.3s ease;

    }


    .faq-sidebar a:hover {

        color:
            var(--gold);

        padding-left:
            5px;

    }


    .faq-category {

        margin-bottom:
            60px;

        scroll-margin-top:
            110px;

    }


    .faq-category:last-child {

        margin-bottom:
            0;

    }


    .category-heading {

        display:
            flex;

        align-items:
            center;

        gap:
            14px;

        margin-bottom:
            25px;

    }


    .category-icon {

        width:
            48px;

        height:
            48px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        border:
            1px solid var(--border);

        background:
            var(--burgundy-dark);

        color:
            var(--gold);

        font-size:
            1rem;

    }


    .category-heading h2 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            2.25rem;

        color:
            var(--cream);

    }


    .faq-list {

        display:
            grid;

        gap:
            12px;

    }


    .faq-item {

        border:
            1px solid var(--border);

        background:
            rgba(
                255,
                255,
                255,
                0.025
            );

    }


    .faq-question {

        width:
            100%;

        border:
            none;

        background:
            transparent;

        color:
            var(--cream);

        padding:
            22px 24px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            space-between;

        gap:
            20px;

        text-align:
            left;

        cursor:
            pointer;

        font-family:
            "Montserrat",
            sans-serif;

        font-size:
            0.92rem;

        font-weight:
            600;

    }


    .faq-question i {

        color:
            var(--gold);

        transition:
            transform 0.3s ease;

        flex-shrink:
            0;

    }


    .faq-answer {

        max-height:
            0;

        overflow:
            hidden;

        transition:
            max-height 0.4s ease;

    }


    .faq-answer-inner {

        padding:
            0 24px 24px;

        color:
            var(--muted);

        font-size:
            0.88rem;

    }


    .faq-answer-inner p {

        margin-bottom:
            12px;

    }


    .faq-answer-inner p:last-child {

        margin-bottom:
            0;

    }


    .faq-answer-inner strong {

        color:
            var(--gold-light);

    }


    .faq-item.active
    .faq-question {

        color:
            var(--gold-light);

    }


    .faq-item.active
    .faq-question i {

        transform:
            rotate(180deg);

    }


    /* ==========================================================
       SUPPORT STRIP
       ========================================================== */

    .support-strip {

        padding:
            75px 0;

        background:
            linear-gradient(
                135deg,
                var(--burgundy-dark),
                var(--burgundy)
            );

        border-top:
            1px solid var(--border);

        border-bottom:
            1px solid var(--border);

    }


    .support-grid {

        display:
            grid;

        grid-template-columns:
            repeat(
                3,
                1fr
            );

        gap:
            20px;

    }


    .support-card {

        padding:
            30px;

        border:
            1px solid
            rgba(
                216,
                176,
                106,
                0.25
            );

        background:
            rgba(
                0,
                0,
                0,
                0.16
            );

    }


    .support-card i {

        color:
            var(--gold);

        font-size:
            1.3rem;

        margin-bottom:
            15px;

    }


    .support-card h3 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            1.65rem;

        color:
            var(--cream);

        margin-bottom:
            8px;

    }


    .support-card p {

        color:
            var(--muted);

        font-size:
            0.82rem;

    }


    /* ==========================================================
       CTA
       ========================================================== */

    .cta {

        padding:
            100px 0;

        text-align:
            center;

        background:
            radial-gradient(
                circle at center,
                rgba(
                    92,
                    24,
                    56,
                    0.35
                ),
                transparent 60%
            );

    }


    .cta h2 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            clamp(
                2.7rem,
                5vw,
                4.5rem
            );

        color:
            var(--cream);

        margin-bottom:
            18px;

    }


    .cta p {

        max-width:
            650px;

        margin:
            0 auto 30px;

        color:
            var(--muted);

    }


    .cta-buttons {

        display:
            flex;

        justify-content:
            center;

        flex-wrap:
            wrap;

        gap:
            12px;

    }


    .btn {

        display:
            inline-flex;

        align-items:
            center;

        justify-content:
            center;

        gap:
            8px;

        padding:
            14px 24px;

        border:
            1px solid var(--gold);

        font-size:
            0.8rem;

        font-weight:
            600;

        letter-spacing:
            0.04em;

        transition:
            0.3s ease;

    }


    .btn-primary {

        background:
            var(--gold);

        color:
            var(--black);

    }


    .btn-primary:hover {

        background:
            var(--gold-light);

    }


    .btn-outline {

        color:
            var(--gold-light);

        background:
            transparent;

    }


    .btn-outline:hover {

        background:
            rgba(
                216,
                176,
                106,
                0.10
            );

    }

       FOOTER
       ========================================================== */

    footer {

        padding:
            70px 0 25px;

        background:
            #0b080d;

        border-top:
            1px solid var(--border);

    }


    .footer-grid {

        display:
            grid;

        grid-template-columns:
            2fr
            1fr
            1fr
            1fr;

        gap:
            45px;

        padding-bottom:
            45px;

    }


    .footer-brand h2 {

        font-family:
            "Cormorant Garamond",
            serif;

        font-size:
            2rem;

        color:
            var(--gold-light);

        margin-bottom:
            15px;

    }


    .footer-brand h2 span {

        color:
            var(--rose);

    }


    .footer-brand p {

        max-width:
            420px;

        color:
            var(--muted);

        font-size:
            0.82rem;

    }


    .footer-badges {

        display:
            flex;

        flex-wrap:
            wrap;

        gap:
            8px;

        margin-top:
            20px;

    }


    .footer-badges span {

        padding:
            7px 11px;

        border:
            1px solid var(--border);

        color:
            var(--gold-light);

        font-size:
            0.68rem;

    }


    .footer-column h3 {

        color:
            var(--cream);

        font-size:
            0.85rem;

        margin-bottom:
            15px;

    }


    .footer-column a {

        display:
            block;

        margin-bottom:
            9px;

        color:
            var(--muted);

        font-size:
            0.76rem;

        transition:
            0.3s ease;

    }


    .footer-column a:hover {

        color:
            var(--gold);

    }


    .footer-bottom {

        padding-top:
            25px;

        border-top:
            1px solid
            rgba(
                255,
                255,
                255,
                0.08
            );

        display:
            flex;

        justify-content:
            space-between;

        gap:
            20px;

        flex-wrap:
            wrap;

    }


    .footer-bottom p {

        color:
            #91858c;

        font-size:
            0.7rem;

    }


    /* ==========================================================
       REVEAL ANIMATION
       ========================================================== */

    .fade-in {

        opacity:
            0;

        transform:
            translateY(24px);

        transition:
            opacity 0.7s ease,
            transform 0.7s ease;

    }


    .fade-in.visible {

        opacity:
            1;

        transform:
            translateY(0);

    }


    /* ==========================================================
       RESPONSIVE
       ========================================================== */

    @media (
        max-width: 950px
    ) {

        .nav-links {

            position:
                absolute;

            top:
                82px;

            left:
                0;

            right:
                0;

            display:
                none;

            flex-direction:
                column;

            align-items:
                stretch;

            padding:
                20px 5% 25px;

            background:
                var(--black-soft);

            border-bottom:
                1px solid var(--border);

        }


        .nav-links.active {

            display:
                flex;

        }


        .nav-links a {

            padding:
                10px 0;

        }


        .menu-toggle {

            display:
                block;

        }


        .faq-layout {

            grid-template-columns:
                1fr;

        }


        .faq-sidebar {

            position:
                static;

        }


        .support-grid {

            grid-template-columns:
                1fr;

        }


        .footer-grid {

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

        }

    }


    @media (
        max-width: 600px
    ) {

        .hero {

            padding:
                80px 0 65px;

        }


        .faq-section {

            padding:
                55px 0 75px;

        }


        .category-heading h2 {

            font-size:
                1.9rem;

        }


        .faq-question {

            padding:
                18px;

            font-size:
                0.84rem;

        }


        .faq-answer-inner {

            padding:
                0 18px 20px;

        }


        .footer-grid {

            grid-template-columns:
                1fr;

        }


        .footer-bottom {

            flex-direction:
                column;

        }

    }

</style>
