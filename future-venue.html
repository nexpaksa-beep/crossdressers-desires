<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        The Desires House | Crossdresser's Desires East Rand
    </title>

    <meta
        name="description"
        content="Discover the future vision of The Desires House — a private, discreet and welcoming destination for adult crossdressers in Gauteng."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {

            --black:
                #100b12;

            --black-soft:
                #171017;

            --burgundy:
                #5c1838;

            --burgundy-dark:
                #351021;

            --rose:
                #b65c7d;

            --gold:
                #d8b06a;

            --gold-light:
                #f1d99b;

            --cream:
                #f7f0e8;

            --muted:
                #c9bcc2;

            --border:
                rgba(216,176,106,0.20);

            --shadow:
                0 25px 70px rgba(0,0,0,0.40);

        }


        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            background:
                var(--black);

            color:
                var(--cream);

            font-family:
                "Montserrat",
                sans-serif;

            line-height:
                1.7;

            overflow-x:
                hidden;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        img {

            max-width:
                100%;

            display:
                block;

        }


        .container {

            width:
                min(1180px, 92%);

            margin:
                0 auto;

        }


        /* ==========================================================
           HEADER
           ========================================================== */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            background:
                rgba(16,11,18,0.94);

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid var(--border);

        }


        .nav {

            min-height:
                82px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                30px;

        }


        .logo {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                30px;

            font-weight:
                600;

            color:
                var(--gold-light);

                0.5px;

                nowrap;

        }

            display:
                block;

            font-family:
                "Montserrat",
                sans-serif;

            font-size:
                9px;

            letter-spacing:
                3px;

            color:
                var(--muted);

            text-transform:
                uppercase;

            margin-top:
                -5px;

        }


        .nav-links {

                24px;

        }

                12px;

            font-weight:
                500;

            letter-spacing:
                0.5px;

            color:
                var(--muted);

            transition:
                0.3s ease;

        }


        .nav-links a:hover {

            color:
                var(--gold-light);

        }


        .nav-links .join {

            padding:
                11px 18px;

            border:
                1px solid var(--gold);

            color:
                var(--gold-light);

        }


        .menu-toggle {

            display:
                none;

            background:
                none;

            border:
                0;

            color:
                var(--gold-light);

            font-size:
                26px;

            cursor:
                pointer;

        }

           HERO
           ========================================================== */

        .hero {

            min-height:
                82vh;

            display:
                flex;

            align-items:
                center;

            position:
                relative;

            background:
                radial-gradient(
                    circle at 80% 30%,
                    rgba(182,92,125,0.20),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    var(--black),
                    var(--burgundy-dark)
                );

            overflow:
                hidden;

        }


        .hero::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    90deg,
                    rgba(16,11,18,0.98),
                    rgba(16,11,18,0.65),
                    rgba(16,11,18,0.25)
                );

        }


        .hero-content {

            position:

            z-index:
                2;

            max-width:

            padding:
                90px 0;

        }


        .eyebrow {

            color:
                var(--gold);

            font-size:
                11px;

            font-weight:
                600;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            margin-bottom:
                20px;

        }


        .hero h1 {

                "Cormorant Garamond",

                0.92;

            margin-bottom:
                28px;

        }

            color:

            font-size:

            line-height:
                1.9;

        }


        .hero-buttons {

            display:

            margin-top:
                35px;

        }


        .btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                14px 26px;

            background:
                var(--gold);

            color:
                var(--black);

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

            transition:
                0.3s ease;

        }


        .btn:hover {

            background:
                var(--gold-light);

            transform:
                translateY(-2px);

        }


        .btn-outline {

            background:
                transparent;

            color:
                var(--gold-light);

            border:
                1px solid var(--gold);

        }


        .btn-outline:hover {

            background:
                rgba(216,176,106,0.10);

        }


        /* ==========================================================
           GENERAL SECTIONS
           ========================================================== */

        section {

            padding:
                105px 0;

        }


        .section-heading {

            max-width:

            margin-bottom:
                55px;

        }


        .section-heading .eyebrow {

            margin-bottom:

        }


        .section-heading h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(42px, 6vw, 65px);

            font-weight:
                500;

            line-height:
                1;

            margin-bottom:
                20px;

        }


        .section-heading p {

            color:
                var(--muted);

            font-size:
                15px;

        }


        /* ==========================================================
           VISION INTRO
           ========================================================== */

        .vision-intro {

            background:
                var(--black-soft);

        }


        .vision-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                70px;

            align-items:
                center;

        }


        .vision-text h3 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                43px;

            font-weight:
                500;

            color:
                var(--gold-light);

            margin-bottom:
                20px;

        }


        .vision-text p {

            color:
                var(--muted);

            margin-bottom:
                18px;

        }


        .image-placeholder {

            min-height:
                460px;

            border:
                1px solid var(--border);

            background:
                linear-gradient(
                    145deg,
                    rgba(92,24,56,0.75),
                    rgba(23,16,23,0.95)
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            position:
                relative;

            overflow:
                hidden;

            box-shadow:
                var(--shadow);

        }


        .image-placeholder img {

            height:

        }

            font-size:

            letter-spacing:
                1px;

            text-transform:

           ========================================================== */

            border-color:

        }


        .space-image {

            height:
                230px;

            position:
                relative;

            background:
                var(--burgundy-dark);

            overflow:

        .space-image img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }


        .space-image .placeholder-label {

            bottom:
                12px;

            left:
                12px;

            right:
                12px;

        }


        .space-content {

            padding:
                28px;

        }


        .space-content h3 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                31px;

            font-weight:
                500;

            color:
                var(--gold-light);

            margin-bottom:
                10px;

        }


        .space-content p {

            color:
                var(--muted);

            font-size:
                13px;

        }


        /* ==========================================================
           FEATURED VISION
           ========================================================== */

        .featured {

            background:
                linear-gradient(
                    135deg,
                    var(--burgundy-dark),
                    var(--black)

        }


        .featured-grid {

            display:
                grid;

            grid-template-columns:
                1.05fr 0.95fr;

            gap:
                65px;

            align-items:
                center;

        }


        .featured-image {

            min-height:
                540px;

            border:
                1px solid var(--border);

            position:
                relative;

            overflow:
                hidden;

            background:
                var(--black-soft);

        }


        .featured-image img {

            width:
                100%;

            height:
                100%;

            min-height:
                540px;

            object-fit:
                cover;

        }


        .featured-copy h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(45px, 6vw, 68px);

            font-weight:
                500;

            line-height:
                0.98;

            color:
                var(--gold-light);

            margin-bottom:
                25px;

        }


        .featured-copy p {

            color:
                var(--muted);

            margin-bottom:
                18px;

        }


        .feature-list {

            list-style:

            margin:

        }


        .feature-list li {

            display:
                flex;

            gap:

            padding:

            border-bottom:

            color:

            font-size:

        }


        .feature-list li::before {

            content:
                "✦";

            color:
                var(--gold);

        }


        /* ==========================================================
           FUTURE EXPERIENCES
           ========================================================== */

        .experiences {

            background:
                var(--black-soft);

        }


        .experience-grid {

                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:

        }


        .experience-card {

            padding:
                35px;

            border:
                1px solid var(--border);

            background:
                rgba(16,11,18,0.65);

        }


        .experience-number {

            color:
                var(--gold);

            font-size:
                11px;

            letter-spacing:
                2px;

            margin-bottom:
                12px;

        }


        .experience-card h3 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                34px;

            font-weight:
                500;

            color:
                var(--cream);

            margin-bottom:
                10px;

        }


        .experience-card p {

            color:
                var(--muted);

            font-size:
                13px;

        }


        /* ==========================================================
           RETREAT VISION
           ========================================================== */

        .retreat {

            background:
                var(--black);

        }


        .retreat-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                60px;

            align-items:
                center;

        }


        .retreat-copy h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                55px;

            font-weight:
                500;

            line-height:
                1;

            margin-bottom:
                20px;

        }


        .retreat-copy h2 span {

            color:
                var(--gold-light);

        }


        .retreat-copy p {

            color:
                var(--muted);

            margin-bottom:
                18px;

        }


        .retreat-points {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                12px;

            margin-top:
                25px;

        }


        .retreat-point {

            border:
                1px solid var(--border);

            padding:
                18px;

            color:
                var(--muted);

            font-size:
                12px;

        }


        .retreat-point strong {

            display:
                block;

            color:
                var(--gold-light);

            margin-bottom:
                5px;

        }


        /* ==========================================================
           PRIVACY
           ========================================================== */

        .privacy {

            background:
                var(--burgundy-dark);

            border-top:
                1px solid var(--border);

            border-bottom:
                1px solid var(--border);

        }
