<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Crossdresser Profiles | Crossdresser's Desires East Rand
    </title>

    <meta
        name="description"
        content="Discover the Crossdresser's Desires community. Browse member profiles, interests and stories in a private 18+ community for crossdressers in Johannesburg, the East Rand and Gauteng."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#100b12"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --black: #100b12;
            --black-soft: #171017;

            --burgundy: #5c1838;
            --burgundy-dark: #351021;

            --rose: #b65c7d;

            --gold: #d8b06a;
            --gold-light: #f1d99b;

            --cream: #f7f0e8;

            --muted: #c9bcc2;

            --border:
                rgba(216, 176, 106, 0.25);

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            font-family:
                Montserrat,
                sans-serif;

            background:
                var(--black);

            color: white;

            line-height: 1.7;

        }


        a {

            text-decoration: none;

            color: inherit;

        }


        .container {

            width:
                min(1180px, 92%);

            margin:
                0 auto;

        }


        .serif {

            font-family:
                "Cormorant Garamond",
                serif;

        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            z-index: 100;

            background:
                rgba(16, 11, 18, 0.94);

            backdrop-filter:
                blur(15px);

            border-bottom:
                1px solid var(--border);

        }


        .nav {

            min-height: 76px;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .brand {

            display: block;

        }


        .brand-name {

            display: block;

            font:
                600 28px
                "Cormorant Garamond",
                serif;

            color:
                var(--gold-light);

            line-height: 1;

        }


        .brand-location {

            display: block;

            margin-top: 4px;

            font-size: 9px;

            letter-spacing: 3px;

            color:
                var(--muted);

            text-transform:
                uppercase;

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 22px;

        }


        .nav-links a {

            font-size: 12px;

            color:
                #e0d7db;

            transition:
                color 0.2s ease;

        }


        .nav-links a:hover {

            color:
                var(--gold-light);

        }


        .nav-join {

            padding:
                10px 17px;

            border:
                1px solid var(--gold);

            border-radius:
                30px;

            color:
                var(--gold-light) !important;

        }


        .menu-toggle {

            display: none;

            background:
                transparent;

            border:
                1px solid var(--border);

            color:
                var(--gold-light);

            padding:
                8px 12px;

            border-radius:
                8px;

            font-size:
                20px;

            cursor:
                pointer;

        }


        /* =====================================================
           HERO
           ===================================================== */

        .page-hero {

            padding:
                165px 0 90px;

            text-align:
                center;

            background:

                radial-gradient(
                    circle at 50% 10%,
                    rgba(182, 92, 125, 0.22),
                    transparent 42%
                ),

                linear-gradient(
                    135deg,
                    #100b12,
                    #24121d 55%,
                    #100b12
                );

            border-bottom:
                1px solid
                rgba(216, 176, 106, 0.12);

        }


        .eyebrow {

            color:
                var(--gold);

            text-transform:
                uppercase;

            letter-spacing:
                4px;

            font-size:
                10px;

            font-weight:
                700;

            margin-bottom:
                16px;

        }


        .page-hero h1 {

            font:
                500 clamp(52px, 8vw, 82px) / 0.95
                "Cormorant Garamond",
                serif;

            color:
                var(--cream);

            margin-bottom:
                20px;

        }


        .page-hero h1 span {

            display:
                block;

            color:
                var(--gold-light);

            font-style:
                italic;

        }


        .page-hero p {

            max-width:
                690px;

            margin:
                0 auto;

            color:
                var(--muted);

            font-size:
                14px;

        }


        .privacy-note {

            display:
                inline-block;

            margin-top:
                25px;

            padding:
                9px 17px;

            border:
                1px solid
                rgba(216, 176, 106, 0.18);

            border-radius:
                30px;

            background:
                rgba(255, 255, 255, 0.025);

            color:
                #bfb0b7;

            font-size:
                10px;

            letter-spacing:
                0.5px;

        }


        /* =====================================================
           COMMUNITY SECTION
           ===================================================== */

        .community {

            padding:
                75px 0 100px;

            background:
                var(--black);

        }


        .community-top {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                end;

            gap:
                30px;

            margin-bottom:
                38px;

        }


        .section-label {

            color:
                var(--gold);

            text-transform:
                uppercase;

            letter-spacing:
                3px;

            font-size:
                10px;

            font-weight:
                700;

            margin-bottom:
                8px;

        }


        .section-title {

            font:
                500 45px / 1
                "Cormorant Garamond",
                serif;

            color:
                var(--cream);

        }


        .community-description {

            max-width:
                520px;

            color:
                var(--muted);

            font-size:
                13px;

        }


        /* =====================================================
           FILTERS
           ===================================================== */

        .profile-tools {

            display:
                flex;

            gap:
                12px;

            flex-wrap:
                wrap;

            margin-bottom:
                35px;

            padding-bottom:
                25px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.07);

        }


        .search-box {

            flex:
                1 1 280px;

            position:
                relative;

        }


        .search-box input {

            width:
                100%;

            height:
                48px;

            padding:
                0 18px;

            background:
                rgba(255, 255, 255, 0.035);

            border:
                1px solid
                rgba(216, 176, 106, 0.18);

            border-radius:
                8px;

            color:
                white;

            outline:
                none;

            font-family:
                Montserrat,
                sans-serif;

            font-size:
                12px;

        }


        .search-box input:focus {

            border-color:
                var(--gold);

        }


        .filter-select {

            height:
                48px;

            padding:
                0 18px;

            background:
                rgba(255, 255, 255, 0.035);

            border:
                1px solid
                rgba(216, 176, 106, 0.18);

            border-radius:
                8px;

            color:
                #ddd2d7;

            outline:
                none;

            font-family:
                Montserrat,
                sans-serif;

            font-size:
                12px;

        }


        .filter-select option {

            background:
                var(--black-soft);

        }


        /* =====================================================
           PROFILE GRID
           ===================================================== */

        .profiles-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                22px;

        }


        .profile-card {

            overflow:
                hidden;

            border:
                1px solid
                rgba(216, 176, 106, 0.15);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.012)
                );

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

        }


        .profile-card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(216, 176, 106, 0.42);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);

        }


        .profile-image {

            height:
                320px;

            position:
                relative;

            overflow:
                hidden;

            background:
                linear-gradient(
                    145deg,
                    #321622,
                    #171017
                );

        }


        .profile-image img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            display:
                block;

            opacity:
                0.9;

        }


        .profile-placeholder {

            width:
                100%;

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font:
                80px
                "Cormorant Garamond",
                serif;

            color:
                rgba(241,217,155,0.35);

            background:
                radial-gradient(
                    circle at center,
                    #5c1838,
                    #171017 70%
                );

        }


        .profile-status {

            position:
                absolute;

            top:
                14px;

            right:
                14px;

            padding:
                6px 10px;

            border-radius:
                20px;

            background:
                rgba(16,11,18,0.82);

            border:
                1px solid
                rgba(216,176,106,0.3);

            color:
                var(--gold-light);

            font-size:
                9px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

        }


        .profile-content {

            padding:
                25px;

        }


        .profile-name {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-bottom:
                3px;

        }


        .profile-name h3 {

            font:
                500 31px
                "Cormorant Garamond",
                serif;

            color:
                var(--cream);

        }


        .verified {

            width:
                19px;

            height:
                19px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            background:
                var(--gold);

            color:
                var(--black);

            font-size:
                10px;

            font-weight:
                700;

        }


        .profile-location {

            color:
                var(--gold);

            font-size:
                10px;

            letter-spacing:
                0.7px;

            margin-bottom:
                13px;

        }


        .profile-bio {

            min-height:
                70px;

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.7;

            margin-bottom:
                17px;

        }


        .interests {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                6px;

            margin-bottom:
                20px;

        }


        .interest {

            padding:
                5px 9px;

            border:
                1px solid
                rgba(216,176,106,0.15);

            border-radius:
                20px;

            color:
                #bcaeb5;

            font-size:
                9px;

        }


        .profile-actions {

            display:
                flex;

            gap:
                8px;

        }


        .profile-button {

            flex:
                1;

            min-height:
                42px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid
                var(--gold);

            border-radius:
                5px;

            color:
                var(--gold-light);

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                0.8px;

            text-transform:
                uppercase;

        }


        .profile-button:hover {

            background:
                rgba(216,176,106,0.08);

        }


        /* =====================================================
           DAILY DESIRES
           ===================================================== */

        .daily {

            padding:
                95px 0;

            background:
                var(--black-soft);

            border-top:
                1px solid
                rgba(216,176,106,0.1);

            border-bottom:
                1px solid
                rgba(216,176,106,0.1);

        }


        .daily-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                22px;

            margin-top:
                38px;

        }


        .blog-card {

            padding:
                30px;

            border:
                1px solid
                rgba(216,176,106,0.15);

            background:
                rgba(255,255,255,0.025);

        }


        .blog-date {

            color:
                var(--gold);

            font-size:
                9px;

            text-transform:
                uppercase;

            letter-spacing:
                2px;

            margin-bottom:
                9px;

        }


        .blog-card h3 {

            font:
                500 32px
                "Cormorant Garamond",
                serif;

            color:
                var(--cream);

            margin-bottom:
                9px;

        }


        .blog-card p {

            color:
                var(--muted);

            font-size:
                12px;

            margin-bottom:
                17px;

        }


        .blog-author {

            color:
                #9e8f97;

            font-size:
                10px;

        }


        .blog-author strong {

            color:
                var(--gold-light);

            font-weight:
                600;

        }


        .daily-cta {

            margin-top:
                35px;

            text-align:
                center;

        }


        /* =====================================================
           JOIN CTA
           ===================================================== */

        .join-section {

            padding:
                90px 0;

            text-align:
                center;

            background:

                radial-gradient(
                    circle at center,
                    rgba(92,24,56,0.38),
                    transparent 60%
                );

        }


        .join-section h2 {

            font:
                500 clamp(42px,6vw,65px)
                "Cormorant Garamond",
                serif;

            color:
                var(--cream);

            margin-bottom:
                16px;

        }


        .join-section p {

            max-width:
                650px;

            margin:
                0 auto 28px;

            color:
                var(--muted);

            font-size:
                13px;

        }


        .btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                50px;

            padding:
                0 24px;

            border-radius:
                30px;

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

        }


        .primary {

            background:
                linear-gradient(
                    135deg,
                    var(--gold-light),
                    var(--gold)
                );

            color:
                var(--black);

        }


        .outline {

            border:
                1px solid
                var(--gold);

            color:
                var(--gold-light);

        }
