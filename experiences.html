<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

        name="description"
        content="Discover the experiences at Crossdresser's Desires East Rand. Explore fashion, makeup, photography, social connection, confidence and private 18+ community experiences."

    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>
        Experiences | Crossdresser's Desires East Rand
    </title>


    <!-- =====================================================
         GOOGLE FONTS
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"

    >


    <!-- =====================================================
         PAGE STYLE
         ===================================================== -->

    <style>

        :root {

            --black:
                #100b12;

            --black-soft:
                #171017;

            --burgundy:
                #5c1838;

            --burgundy-dark:
                #351021;

            --rose:
                #b65c7d;

            --gold:
                #d8b06a;

            --gold-light:
                #f1d99b;

            --cream:
                #f7f0e8;

            --muted:
                #c9bcc2;

            --border:
                rgba(216,176,106,0.20);

            --shadow:
                0 25px 70px rgba(0,0,0,0.40);

        }


        * {

            margin:
                0;

            padding:
                0;

            box-sizing:
                border-box;

        }


        html {

            scroll-behavior:
                smooth;

        }


        body {

            background:
                var(--black);

            color:
                var(--cream);

            font-family:
                "Montserrat",
                sans-serif;

            line-height:
                1.7;

            overflow-x:
                hidden;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        img {

            max-width:
                100%;

            display:
                block;

        }


        .container {

            width:
                min(
                    1180px,
                    calc(100% - 40px)
                );

            margin:
                0 auto;

        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            background:
                rgba(
                    16,
                    11,
                    18,
                    0.94
                );

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid var(--border);

        }


        .nav {

            min-height:
                82px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                30px;

        }


        .logo {

            display:
                flex;

            flex-direction:
                column;

            line-height:
                1;

        }


        .logo-main {

            color:
                var(--gold-light);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                30px;

            font-weight:
                600;

            letter-spacing:
                0.5px;

        }


        .logo-sub {

            color:
                var(--muted);

            font-size:
                8px;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            margin-top:
                7px;

        }


        .nav-links {

            display:
                flex;

            align-items:
                center;

            gap:
                25px;

        }


        .nav-links a {

            color:
                var(--muted);

            font-size:
                12px;

            font-weight:
                500;

            letter-spacing:
                0.5px;

            transition:
                0.3s ease;

        }


        .nav-links a:hover,
        .nav-links a.active {

            color:
                var(--gold-light);

        }


        .join-button {

            background:
                linear-gradient(
                    135deg,
                    var(--gold),
                    var(--gold-light)
                );

            color:
                var(--black);

            padding:
                12px 20px;

            border-radius:
                999px;

            font-size:
                11px;

            font-weight:
                700;

            letter-spacing:
                0.8px;

            transition:
                0.3s ease;

        }


        .join-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px rgba(
                    216,
                    176,
                    106,
                    0.22
                );

        }


        .menu-button {

            display:
                none;

            border:
                1px solid var(--border);

            background:
                transparent;

            color:
                var(--gold-light);

            width:
                44px;

            height:
                44px;

            border-radius:
                50%;

            cursor:
                pointer;

            font-size:
                20px;

        }


        /* =====================================================
           HERO
           ===================================================== */

        .hero {

                        92,

                    circle at 15% 80%,
                    rgba(
                        92,
                        24,
                        56,
                        0.28
                    ),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    var(--black),
                    var(--burgundy-dark)
                );

        }


        .hero::before {

            content:
                "";

            position:
                absolute;

            width:
                480px;

            height:
                480px;

            border:

                rgba(
                    216,
                    176,
                    106,
                    0.10

            border-radius:
                50%;

            right:
                -180px;

            top:
                -100px;

        }


        .hero::after {

            content:
                "";

            position:
                absolute;

            width:
                300px;

            height:
                300px;

            border:
                1px solid
                rgba(
                    182,
                    92,
                    125,
                    0.12

            border-radius:
                50%;

            left:
                -150px;

            bottom:
                -120px;

        }


        .hero-content {

            position:
                relative;

            z-index:
                2;

            max-width:
                850px;

            padding:
                100px 0;

        }


        .eyebrow {

            color:
                var(--gold);

            text-transform:
                uppercase;

            letter-spacing:
                4px;

            font-size:
                11px;

            font-weight:
                600;

            margin-bottom:
                18px;

        }


        .hero h1 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    60px,
                    9vw,
                    105px
                );

            line-height:
                0.92;

            font-weight:
                500;

            color:
                var(--cream);

            margin-bottom:
                30px;

        }


        .hero h1 span {

            color:
                var(--gold-light);

        }


        .hero-text {

            max-width:
                720px;

            color:
                var(--muted);

            font-size:
                17px;

            line-height:
                1.9;

            margin-bottom:
                35px;

        }


        .hero-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                10px;

            padding:
                10px 18px;

            border:
                1px solid var(--border);

            border-radius:
                999px;

            color:
                var(--cream);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.03
                );

            font-size:
                11px;

            letter-spacing:
                1px;

        }


        /* =====================================================
           GENERAL SECTIONS
           ===================================================== */

        .section {

            padding:
                110px 0;

        }


        .section-heading {

            max-width:
                760px;

            margin:
                0 auto 60px;

            text-align:
                center;

        }


        .small-title {

            color:
                var(--gold);

            text-transform:
                uppercase;

            letter-spacing:
                3px;

            font-size:
                10px;

            font-weight:
                600;

            margin-bottom:
                12px;

        }


        .section-heading h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            color:
                var(--cream);

            font-size:
                clamp(
                    42px,
                    6vw,
                    66px
                );

            line-height:
                1;

            font-weight:
                500;

            margin-bottom:
                20px;

        }


        .section-heading p {

            color:
                var(--muted);

            font-size:
                15px;

            line-height:
                1.9;

        }

           EXPERIENCE GRID
           ===================================================== */

        .experience-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                22px;

        }


        .experience-card {

            position:
                relative;

            min-height:

            padding:
                38px;

            border:
                1px solid var(--border);

            background:
                linear-gradient(
                    145deg,
                    rgba(
                        255,
                        255,
                        255,
                        0.045

                    rgba(

                        255,

            border-radius:
                18px;

            overflow:
                hidden;

            transition:
                0.35s ease;

        }


        .experience-card::after {

            content:
                "";

            position:
                absolute;

            width:
                150px;

            height:
                150px;

            border-radius:
                50%;

            background:
                rgba(
                    182,
                    92,
                    125,
                    0.08
                );

            right:
                -70px;

            bottom:
                -70px;

        }


        .experience-card:hover {

            transform:
                translateY(-7px);

            border-color:
                rgba(
                    216,
                    176,
                    106,
                    0.48
                );

            box-shadow:
                var(--shadow);

        }


        .experience-icon {

            width:
                58px;

            height:
                58px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid var(--border);

            border-radius:
                50%;

            color:
                var(--gold-light);

            font-size:
                22px;

            margin-bottom:
                25px;

            background:
                rgba(
                    92,
                    24,
                    56,
                    0.30
                );

        }


        .experience-card h3 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                30px;

            font-weight:
                600;

            color:
                var(--cream);

            margin-bottom:
                12px;

        }


        .experience-card p {

            color:
                var(--muted);

            font-size:
                13px;

            line-height:
                1.85;

        }

           FEATURE SECTION
           ===================================================== */

        .feature-section {

            background:
                linear-gradient(
                    135deg,
                    var(--burgundy-dark),
                    var(--black-soft)

            border-bottom:

        }


        .feature-layout {

            display:
                grid;

            gap:

            align-items:
                center;

        }


        .feature-copy .small-title {

            text-align:
                left;

        }


        .feature-copy h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    45px,
                    5vw,
                    70px
                );

            line-height:
                0.98;

            font-weight:
                500;

            margin-bottom:
                25px;

        }


        .feature-copy h2 span {

            color:
                var(--gold-light);

        }


        .feature-copy p {

            color:
                var(--muted);

            font-size:
                14px;

            line-height:
                1.95;

            margin-bottom:
                18px;

        }


        .feature-list {

            display:
                grid;

            gap:
                14px;

                30px;

        }

            align-items:

            line-height:

        }

            display:
                block;

            color:
                var(--cream);

            font-size:
                13px;

            margin-bottom:

        }


        .feature-list-item span {

            color:
                var(--muted);

            font-size:
                12px;

        }

            padding:

            border:

            border-radius:
                24px;

            background:
                rgba(
                    16,
                    11,
                    18,
                    0.65
                );

            box-shadow:
                var(--shadow);

        }


        .panel-label {

            color:
                var(--gold);

            text-transform:
                uppercase;

            letter-spacing:
                3px;

            font-size:
                10px;

            margin-bottom:
                25px;

        }


        .panel-title {

                "Cormorant Garamond",
                serif;

            color:
                var(--gold-light);

            font-size:
                43px;

            line-height:

            margin-bottom:
                30px;

        }


        .journey {

            display:
                flex;

            flex-direction:
                column;

        }


        .journey-item {

            display:
                grid;

            grid-template-columns:
                45px 1fr;

            gap:
                15px;

            padding:

                1px solid
                rgba(
                    216,
                    176,
                    106,
                    0.12
                );

        }


        .journey-item:last-child {

            border-bottom:
                none;

        }

            width:
                36px;

            height:
                36px;

                flex;

                center;
